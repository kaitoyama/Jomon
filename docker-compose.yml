version: "3"
services:
  proxy:
    image: nginx
    ports:
      - "3005:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jomon-server
      - jomon-client

  jomon-server:
    build:
      context: ./
      dockerfile: ./development/Dockerfile
    entrypoint: dockerize -wait tcp://db:3306 -timeout 60s
    command: task -w
    environment:
      MARIADB_USERNAME: root
      MARIADB_PASSWORD: password
      MARIADB_HOSTNAME: db
      MARIADB_DATABASE: jomon
      # Checkin → Jomon service-to-service auth. Consumed ONLY by the production
      # (!debug) build's AuthUser; the local debug build authenticates every
      # request as MyUser/admin and ignores these. SERVICE_TOKEN must equal
      # Checkin's JOMON_API_TOKEN; SERVICE_USER_TRAP_ID must be a Jomon admin
      # (it is recorded as the repaid-by actor on write-back).
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SERVICE_USER_TRAP_ID: ${SERVICE_USER_TRAP_ID:-}
    ports:
      - "1323:1323"
    volumes:
      - "./:/src"
    depends_on:
      - db

  jomon-client:
    build: ./client
    volumes:
      - "./client:/app:cached"
      - "/app/node_modules"
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    entrypoint: npm run dev

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jomon
      TZ: Asia/Tokyo
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

    ports:
      # Remapped to avoid clashing with Checkin's MariaDB on host :3306.
      - "3308:3306"
